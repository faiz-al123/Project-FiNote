$kind: collection
description: Koleksi tes backend FiNote. Jalankan Login dulu, token otomatis tersimpan di variabel {{token}}. Jangan commit token asli ke GitHub.
variables:
  - key: base_url
    value: http://localhost:3000/api
    disabled: false
  - key: token
    value: ""
    disabled: false
  - key: json_web_token_17sb
    secret: true
    disabled: false
  - key: pengingat_id
    value: ""
    disabled: false
auth:
  - id: 4b4c14c3-137a-4d5d-8228-3379caa15cf3
    type: bearer
    name: bearer auth
    credentials:
      token: "{{token}}"
