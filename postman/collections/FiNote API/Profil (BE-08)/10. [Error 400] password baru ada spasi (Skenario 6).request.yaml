$kind: http-request
url: http://localhost:3000/api/profil/password
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password_lama": "passwordAman123",
      "password_baru": "ada spasi 123",
      "konfirmasi_password": "ada spasi 123"
    }
auth:
  type: bearer
  credentials:
    token: "{{json_web_token_14zi}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Pesan: Password min.8 karakter tanpa spasi', () => pm.expect(pm.response.json().message).to.eql("Password min.8 karakter tanpa spasi"));
    language: text/javascript
examples: .resources/10. [Error 400] password baru ada spasi (Skenario 6).resources/examples
order: 10000
