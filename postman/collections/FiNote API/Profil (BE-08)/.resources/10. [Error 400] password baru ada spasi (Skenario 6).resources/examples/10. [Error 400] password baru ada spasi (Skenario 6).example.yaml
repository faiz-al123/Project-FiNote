$kind: http-example
request:
  url: http://localhost:3000/api/profil/password
  method: PUT
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "password_lama": "passwordAman123",
        "password_baru": "ada spasi 123",
        "konfirmasi_password": "ada spasi 123"
      }
