    X-Powered-By: Express
    Vary: Origin
    Access-Control-Allow-Credentials: "true"
    Content-Type: application/json; charset=utf-8
    Content-Length: "77"
    ETag: W/"4d-q+3wk0r35wlbcZWW1DagTR0Hy4s"
    Date: Thu, 26 Nov 2026 09:32:55 GMT
    Connection: keep-alive
    Keep-Alive: timeout=5
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Password min.8 karakter tanpa spasi",
        "data": null
      }
order: 1000
