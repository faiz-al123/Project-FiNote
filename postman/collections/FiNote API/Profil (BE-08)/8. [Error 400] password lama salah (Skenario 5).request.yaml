$kind: http-request
url: http://localhost:3000/api/profil/password
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password_lama": "salahSekali1",
      "password_baru": "PasswordBaru456",
      "konfirmasi_password": "PasswordBaru456"
    }
auth:
  type: bearer
  credentials:
    token: "{{json_web_token_14zi}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Pesan: Password saat ini tidak sesuai', () => pm.expect(pm.response.json().message).to.eql("Password saat ini tidak sesuai"));
    language: text/javascript
examples: .resources/8. [Error 400] password lama salah (Skenario 5).resources/examples
order: 8000
