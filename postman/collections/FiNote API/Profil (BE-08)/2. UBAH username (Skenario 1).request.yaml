$kind: http-request
url: http://localhost:3000/api/profil
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "ContohBaru"
    }
auth:
  type: bearer
  credentials:
    token: "{{json_web_token_14zi}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Pesan: Informasi Profile berhasil diubah', () => pm.expect(pm.response.json().message).to.eql("Informasi Profile berhasil diubah"));
    language: text/javascript
examples: .resources/2. UBAH username (Skenario 1).resources/examples
order: 2000
