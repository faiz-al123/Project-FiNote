$kind: http-request
url: http://localhost:3000/api/profil/password
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password_lama": "PasswordBaru456",
      "password_baru": "passwordAman123",
      "konfirmasi_password": "passwordAman123"
    }
auth:
  type: bearer
  credentials:
    token: "{{json_web_token_14zi}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
examples: .resources/7. Kembalikan password (supaya bisa diulang).resources/examples
order: 7000
