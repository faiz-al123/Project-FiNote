$kind: http-request
url: http://localhost:3000/api/profil/password
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password_lama": "passwordAman123",
      "password_baru": "PasswordBaru456",
      "konfirmasi_password": "BedaSekali789"
    }
auth:
  type: bearer
  credentials:
    token: "{{json_web_token_14zi}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Pesan: Password tidak sesuai', () => pm.expect(pm.response.json().message).to.eql("Password tidak sesuai"));
    language: text/javascript
examples: .resources/11. [Error 400] konfirmasi tidak sama (Skenario 7).resources/examples
order: 11000
