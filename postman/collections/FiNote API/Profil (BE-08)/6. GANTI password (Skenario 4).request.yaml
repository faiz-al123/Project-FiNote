$kind: http-request
url: http://localhost:3000/api/profil/password
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password_lama": "passwordAman123",
      "password_baru": "PasswordBaru456",
      "konfirmasi_password": "PasswordBaru456"
    }
auth:
  type: bearer
  credentials:
    token: "{{json_web_token_14zi}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Pesan: Password berhasil dirubah', () => pm.expect(pm.response.json().message).to.eql("Password berhasil dirubah"));
    language: text/javascript
examples: .resources/6. GANTI password (Skenario 4).resources/examples
order: 6000
