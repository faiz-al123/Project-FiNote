$kind: http-example
request:
  url: http://localhost:3000/api/transaksi
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "kategori_id": 9999,
        "jumlah": 1000
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    X-Powered-By: Express
    Vary: Origin
    Access-Control-Allow-Credentials: "true"
    Content-Type: application/json; charset=utf-8
    Content-Length: "63"
    ETag: W/"3f-+o8BRLyyZW0BdMsr8QJIDKGPTQk"
    Date: Tue, 03 Nov 2026 09:05:02 GMT
    Connection: keep-alive
    Keep-Alive: timeout=5
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Kategori tidak valid.",
        "data": null
      }
order: 1000
